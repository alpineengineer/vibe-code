

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>
    .form-group + .form-group {
      margin-top: 16px;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

<body>
<main>
  <h1>Login</h1>

  <form action="#" method="post">
    <div class="form-group">
      <label for="username">Username:</label>
      <input
        type="text"
        id="username"
        name="username"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      >
    </div>

    <button type="submit">Submit</button>
  </form>
</main>

<footer>
  <h2>Koty Steele</h2>
  <h3>&copy;</h3>
  <h2>August 1, 2026</h2>
</footer>
</body>
</html>
