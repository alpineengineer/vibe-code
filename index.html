<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A nature-inspired login page created by Koty Steele.">
  <title>Login</title>

  <style>
    :root {
      color-scheme: dark;
      --card-background: rgba(8, 20, 16, 0.80);
      --card-border: rgba(255, 255, 255, 0.18);
      --input-background: rgba(255, 255, 255, 0.09);
      --input-border: rgba(255, 255, 255, 0.24);
      --text-primary: #f3f7f4;
      --text-secondary: #c5d0ca;
      --accent: #b9d6c2;
      --accent-strong: #d8eadc;
      --error: #ffc0b9;
      --success: #c9f7d5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text-primary);
      background: #07100d;
    }

    button,
    input {
      font: inherit;
    }

    .background,
    .background-slide,
    .background-overlay {
      position: fixed;
      inset: 0;
    }

    .background {
      z-index: -1;
      overflow: hidden;
      background: #07100d;
    }

    .background-slide {
      opacity: 0;
      transform: scale(1.04);
      background-position: center;
      background-size: cover;
      transition: opacity 1.1s ease, transform 7s ease;
    }

    .background-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .background-overlay {
      background:
        linear-gradient(110deg, rgba(3, 10, 8, 0.82), rgba(5, 18, 14, 0.35) 54%, rgba(2, 8, 7, 0.72)),
        linear-gradient(to top, rgba(2, 8, 7, 0.76), transparent 44%);
    }

    main {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 76px);
      padding: 40px 20px 20px;
    }

    .login-card {
      width: min(100%, 420px);
      padding: 36px;
      border: 1px solid var(--card-border);
      border-radius: 26px;
      background: var(--card-background);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin-bottom: 26px;
      border-radius: 15px;
      color: #12221b;
      background: linear-gradient(145deg, var(--accent-strong), #8fb69c);
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 3.4rem);
      line-height: 1;
    }

    .intro {
      margin: 14px 0 28px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .form-group + .form-group {
      margin-top: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.93rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      border: 1px solid var(--input-border);
      border-radius: 14px;
      outline: none;
      color: var(--text-primary);
      background: var(--input-background);
    }

    input::placeholder {
      color: rgba(235, 241, 237, 0.52);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(185, 214, 194, 0.14);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 72px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      padding: 8px 10px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 9px;
      color: var(--accent-strong);
      background: transparent;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .password-toggle:hover,
    .password-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.09);
      outline: none;
    }

    .field-error {
      display: block;
      min-height: 18px;
      margin-top: 6px;
      color: var(--error);
      font-size: 0.78rem;
    }

    .submit-button {
      width: 100%;
      min-height: 52px;
      margin-top: 10px;
      border: 0;
      border-radius: 14px;
      color: #102019;
      background: linear-gradient(135deg, var(--accent-strong), #91bda0);
      cursor: pointer;
      font-weight: 800;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .submit-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .form-message {
      min-height: 22px;
      margin: 14px 0 0;
      color: var(--success);
      text-align: center;
      font-size: 0.9rem;
    }

    .slide-controls {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 22px;
    }

    .slide-dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .slide-dot.active {
      background: var(--accent-strong);
    }

    footer {
      display: grid;
      place-items: center;
      min-height: 76px;
      padding: 14px 20px 22px;
      text-align: center;
    }

    footer h2 {
      margin: 0;
      color: rgba(244, 247, 245, 0.86);
      font-size: 1rem;
      font-weight: 600;
    }

    .copyright-symbol {
      font-size: 0.78em;
      vertical-align: 0.08em;
    }

    @media (max-width: 520px) {
      .login-card {
        padding: 28px 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>

<main>
  <section class="login-card" aria-labelledby="login-heading">
    <div class="brand-mark" aria-hidden="true">KS</div>
    <p class="eyebrow">Welcome back</p>
    <h1 id="login-heading">Login</h1>
    <p class="intro">Sign in to continue your journey.</p>

    <form id="login-form" action="#" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
        <small class="field-error" id="username-error" aria-live="polite"></small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button class="password-toggle" id="password-toggle" type="button">Show</button>
        </div>
        <small class="field-error" id="password-error" aria-live="polite"></small>
      </div>

      <button class="submit-button" type="submit">Submit</button>
      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
    </form>

    <div class="slide-controls" aria-label="Choose a background image">
      <button class="slide-dot active" type="button" data-slide="0" aria-label="Show misty forest"></button>
      <button class="slide-dot" type="button" data-slide="1" aria-label="Show rocky coast"></button>
      <button class="slide-dot" type="button" data-slide="2" aria-label="Show forest cabin"></button>
    </div>
  </section>
</main>

<footer>
  <h2>Koty Steele <span class="copyright-symbol">&copy;</span> August 1, 2026</h2>
</footer>

<script>
  const slides = document.querySelectorAll('.background-slide');
  const dots = document.querySelectorAll('.slide-dot');
  const form = document.querySelector('#login-form');
  const username = document.querySelector('#username');
  const password = document.querySelector('#password');
  const passwordToggle = document.querySelector('#password-toggle');
  const usernameError = document.querySelector('#username-error');
  const passwordError = document.querySelector('#password-error');
  const formMessage = document.querySelector('#form-message');

  let activeSlide = 0;
  let slideTimer;

  function showSlide(index) {
    activeSlide = index;
    slides.forEach((slide, position) => slide.classList.toggle('active', position === index));
    dots.forEach((dot, position) => dot.classList.toggle('active', position === index));
  }

  function startSlideshow() {
    clearInterval(slideTimer);
    slideTimer = setInterval(() => {
      showSlide((activeSlide + 1) % slides.length);
    }, 6500);
  }

  dots.forEach((dot) => {
    dot.addEventListener('click', () => {
      showSlide(Number(dot.dataset.slide));
      startSlideshow();
    });
  });

  passwordToggle.addEventListener('click', () => {
    const isHidden = password.type === 'password';
    password.type = isHidden ? 'text' : 'password';
    passwordToggle.textContent = isHidden ? 'Hide' : 'Show';
    password.focus();
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    usernameError.textContent = '';
    passwordError.textContent = '';
    formMessage.textContent = '';

    let valid = true;

    if (!username.value.trim()) {
      usernameError.textContent = 'Please enter your username.';
      valid = false;
    }

    if (!password.value) {
      passwordError.textContent = 'Please enter your password.';
      valid = false;
    }

    if (valid) {
      formMessage.textContent = `Welcome, ${username.value.trim()}! This is a front-end demonstration.`;
    }
  });

  showSlide(activeSlide);
  startSlideshow();
</script>
</body>
</html>
